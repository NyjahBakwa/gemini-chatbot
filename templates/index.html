<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Gemini Chatbot</h1>
    <p>Stel een vraag. De chatbot onthoudt het gesprek tot je het wist.</p>

    <div class="gesprek">
        {% for bericht in gesprek %}
            <div class="bericht {{ bericht.rol }}">
                <strong>{% if bericht.rol == "gebruiker" %}Jij{% else %}AI{% endif %}:</strong>
                <p>{{ bericht.tekst }}</p>
            </div>
        {% else %}
            <p><em>Nog geen berichten.</em></p>
        {% endfor %}
    </div>

    {% if fout %}
        <p class="fout">{{ fout }}</p>
    {% endif %}

    <form method="post">
        <label for="vraag">Je vraag:</label><br>
        <textarea id="vraag" name="vraag" rows="3" required></textarea><br>
        <button type="submit">Versturen</button>
        <a href="{{ url_for('wissen') }}">Gesprek wissen</a>
    </form>
</body>
</html>
